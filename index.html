<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ASCII Art Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>✨ ASCII Art Generator ✨</h1>
    <p>Upload an image, and we’ll transform it into ASCII art instantly.</p>
  </header>

  <div class="panel">
    <div class="controls">
      <input type="file" id="fileInput" accept="image/*" />
      <label for="sizeRange">Font size: <span id="sizeVal">10</span>px</label>
      <input id="sizeRange" type="range" min="6" max="20" value="10" />
      <button id="toggleColorBtn" type="button">🎨 Color Mode: OFF</button>
      <button id="copyBtn" type="button">📋 Copy</button>
      <button id="downloadBtn" type="button">💾 Download</button>
    </div>

    <!-- Show uploaded image -->
    <div class="image-container">
      <img id="uploadedImage" src="" alt="Uploaded Image" style="display:none;">
    </div>

    <div class="ascii-container">
      <pre class="ascii" id="asciiBlock">[Upload an image to see ASCII art here]</pre>
    </div>
  </div>

  <canvas id="hiddenCanvas" style="display:none;"></canvas>

  <script src="script.js"></script>
</body>
</html>
